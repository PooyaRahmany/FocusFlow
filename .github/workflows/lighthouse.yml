name: Lighthouse CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli
      - name: Run mobile Lighthouse (3 runs, 95+ target)
        id: mobile
        run: lhci autorun --config=.lighthouserc.mobile.json
        continue-on-error: true
      - name: Run desktop Lighthouse (3 runs, 95+ target)
        id: desktop
        run: lhci autorun --config=.lighthouserc.desktop.json
        continue-on-error: true
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: warn
      - name: Enforce score thresholds
        if: always()
        run: |
          if [ "${{ steps.mobile.outcome }}" != "success" ] || [ "${{ steps.desktop.outcome }}" != "success" ]; then
            echo "Lighthouse did not meet one or more 95+ category thresholds. Review the uploaded reports."
            exit 1
          fi
